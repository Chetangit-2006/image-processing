
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image Processing </title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">IMAGE PROCESSING LAB<small></small></div>
  <div class="dept">Department of Computer Science and Engineering<br></div>
  <nav id="nav"></nav>
</aside>

<main class="main">
  <header>
    <div><span class="eyebrow" id="pno">PRACTICAL 3</span><h1 id="title">Basic Image Operations</h1></div>
    <div class="status" id="status">Ready</div>
  </header>

  <section class="aim card"><b>AIM</b><p id="aim"></p></section>

  <section class="card">
    <div id="drop" class="drop">
      <div class="upload-icon">↑</div>
      <h3>Drag & Drop your image here</h3>
      <p>or click to browse · JPG, JPEG, PNG</p>
      <input id="file" type="file" accept="image/png,image/jpeg">
      <button class="secondary" id="browse">Choose Image</button>
    </div>
    <div id="preview" class="preview hidden">
      <img id="original" alt="Original">
      <div><b id="filename"></b><button class="secondary" id="replace">Replace Image</button></div>
    </div>
  </section>

  <section class="card controls">
    <h2>Operation</h2>
    <div id="controls"></div>
    <button class="primary" id="apply">Apply Operation</button>
  </section>

  <section class="card results">
    <div class="result-head"><h2>Result</h2><a id="download" class="secondary hidden">Download Result</a></div>
    <div id="resultGrid" class="result-grid">
      <div class="placeholder">Upload an image and apply an operation to see the result.</div>
    </div>
    <div id="stats"></div>
  </section>
</main>
</div>
<script src="/static/app.js"></script>
</body>
</html>
